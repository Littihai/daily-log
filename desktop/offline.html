<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Log</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.6 "Segoe UI", "Noto Sans Thai", system-ui, sans-serif; background: #f1f2f4; color: #18181b; }
  @media (prefers-color-scheme: dark) { body { background: #0c0c0e; color: #f4f4f5; } .card { background: #1c1d21 !important; } button { background: #f4f4f5 !important; color: #18181b !important; } }
  .card { background: #fff; border-radius: 24px; padding: 40px 36px; max-width: 440px; text-align: center; box-shadow: 0 24px 60px rgba(20,20,30,.1); }
  h1 { margin: 0 0 8px; font-size: 26px; }
  p { margin: 0 0 22px; color: #71717a; }
  button { border: 0; border-radius: 99px; padding: 14px 32px; font: 600 16px inherit; background: #26272b; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<div class="card">
  <h1>เชื่อมต่ออินเทอร์เน็ตไม่ได้</h1>
  <p>Daily Log ต้องใช้อินเทอร์เน็ตเพื่อดึงและบันทึกงาน ตรวจสอบการเชื่อมต่อแล้วกดลองใหม่ หน้านี้จะลองให้เองเมื่อกลับมาออนไลน์</p>
  <button id="retry" type="button">ลองใหม่</button>
</div>
<script>
  const go = () => { location.href = 'https://ritz-dailylog-3476.web.app/'; };
  document.getElementById('retry').addEventListener('click', go);
  window.addEventListener('online', go);
</script>
</body>
</html>
